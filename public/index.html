<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sant Andreu RPG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --panel-bg: #1d2142;
    --panel-border: #f4f1e8;
    --panel-shadow: #0b0d1f;
    --text: #f4f1e8;
    --accent: #ffd35a;
    --muted: #9aa3c7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10121f; color: var(--text);
    font-family: "Press Start 2P", ui-monospace, monospace; font-variant-ligatures: none; }
  canvas#game { touch-action: none; position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; cursor: grab; }
  canvas#game.dragging { cursor: grabbing; }
  .panel { position: fixed; background: var(--panel-bg); border: 3px solid var(--panel-border);
    box-shadow: 0 0 0 3px var(--panel-shadow), 4px 4px 0 3px rgba(0,0,0,.35); border-radius: 4px;
    padding: 10px 12px; font-size: 10px; line-height: 1.7; }
  #location { top: 16px; left: 16px; max-width: min(460px, calc(100vw - 32px)); }
  #location .street { color: var(--accent); font-size: 12px; }
  #location .place { color: var(--text); }
  #location .meta { color: var(--muted); font-size: 8px; }
  #online { display: flex; align-items: center; gap: 6px; font-size: 8px; color: #9fd3ff; margin-top: 2px; }
  #online i { width: 7px; height: 7px; background: #4ade80; box-shadow: 0 0 0 1px #0b0d1f; }
  #online.offline { color: var(--muted); }
  #online.offline i { background: #6b7280; }
  #minimap-wrap { right: 16px; bottom: 34px; padding: 6px; }
  #minimap { display: block; image-rendering: pixelated; cursor: crosshair; }
  #minimap-wrap .title { font-size: 8px; color: var(--muted); margin-bottom: 4px; text-align: center; }
  #help { left: 16px; bottom: 34px; font-size: 8px; line-height: 2; }
  #help b { color: var(--accent); font-weight: normal; }
  #attribution { position: fixed; right: 8px; bottom: 6px; font: 11px system-ui, sans-serif; color: #c9cbe0;
    background: rgba(16,18,31,.7); padding: 2px 6px; border-radius: 3px; }
  #attribution a { color: #c9cbe0; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #10121f; z-index: 10; font-size: 12px; }
  .hidden { display: none !important; }
  #toast { top: 16px; left: 50%; transform: translateX(-50%); font-size: 10px; transition: opacity .3s; }
  #zoom { top: 16px; right: 16px; display: flex; align-items: center; gap: 10px; padding: 6px; }
  #zoom button { font: inherit; font-size: 14px; width: 34px; height: 34px; color: var(--text); background: #2c3266;
    border: 2px solid var(--panel-border); border-radius: 3px; cursor: pointer; box-shadow: inset -2px -2px 0 #161a3a; padding: 0; }
  #zoom button:hover:not(:disabled) { background: #3b4285; color: var(--accent); }
  #zoom button:active:not(:disabled) { box-shadow: inset 2px 2px 0 #161a3a; }
  #zoom button:disabled { opacity: .35; cursor: default; }
  #zoom-level { min-width: 52px; text-align: center; font-size: 11px; color: var(--accent); }
  #zoom-level small { display: block; font-size: 7px; color: var(--muted); margin-bottom: 3px; }
  #avatar-btn { top: 78px; right: 16px; font: inherit; font-size: 10px; color: var(--text); cursor: pointer; padding: 9px 12px; }
  #avatar-btn:hover { color: var(--accent); }
  #avatar-panel { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(8,9,20,.55); padding: 16px; }
  #avatar-panel .panel { position: relative; width: min(620px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
    display: grid; grid-template-columns: 180px 1fr; gap: 18px; padding: 16px; }
  #avatar-panel h2 { grid-column: 1 / -1; margin: 0; font-size: 13px; font-weight: normal; color: var(--accent); }
  #avatar-side { display: flex; flex-direction: column; gap: 12px; }
  #avatar-preview { width: 180px; height: 190px; image-rendering: pixelated; background:
    repeating-conic-gradient(#2a3060 0 25%, #252a55 0 50%) 0 0 / 24px 24px; border: 2px solid #3b4285; border-radius: 3px; }
  #avatar-side label { font-size: 8px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  #avatar-name { font: inherit; font-size: 10px; padding: 8px; color: var(--text); background: #11142c; border: 2px solid var(--panel-border); border-radius: 3px; width: 100%; }
  #avatar-name:focus { outline: none; border-color: var(--accent); }
  #avatar-fields { display: flex; flex-direction: column; gap: 12px; }
  #avatar-fields .label { font-size: 8px; color: var(--muted); margin-bottom: 6px; }
  .swatches, .choices { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatches button { width: 24px; height: 24px; border: 2px solid #0b0d1f; border-radius: 3px; cursor: pointer; padding: 0; box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); }
  .swatches button.selected { outline: 3px solid var(--accent); outline-offset: 1px; }
  .choices button, .avatar-actions button { font: inherit; font-size: 8px; padding: 7px 8px; color: var(--text); background: #2c3266;
    border: 2px solid #4a5196; border-radius: 3px; cursor: pointer; }
  .choices button:hover, .avatar-actions button:hover { border-color: var(--panel-border); }
  .choices button.selected { background: var(--accent); color: #1d2142; border-color: var(--accent); }
  .avatar-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  #avatar-done { background: var(--accent); color: #1d2142; border-color: var(--accent); }
  @media (max-width: 560px) {
    #avatar-panel .panel { grid-template-columns: 1fr; }
    #avatar-side { align-items: center; }
  }
  /* Controls tàctils (només a mòbil / tauleta) */
  .touch-only { display: none !important; }
  body.touch .touch-only { display: flex !important; }
  body.touch { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body.touch #help, body.touch .key-hint { display: none; }
  #joystick { position: fixed; left: calc(24px + env(safe-area-inset-left)); bottom: calc(40px + env(safe-area-inset-bottom));
    width: 132px; height: 132px; border-radius: 50%; align-items: center; justify-content: center; touch-action: none;
    background: rgba(29,33,66,.55); border: 3px solid rgba(244,241,232,.7); box-shadow: 0 0 0 3px rgba(11,13,31,.5); z-index: 3; }
  #joystick::before { content: ""; position: absolute; inset: 16px; border-radius: 50%; border: 2px dashed rgba(244,241,232,.25); }
  #joystick .knob { width: 56px; height: 56px; border-radius: 50%; background: #f4f1e8; border: 3px solid #0b0d1f;
    box-shadow: inset -4px -4px 0 #b9b4a6; pointer-events: none; }
  #joystick.active .knob { background: var(--accent); box-shadow: inset -4px -4px 0 #c99a2a; }
  .touch-btn { position: fixed; font: inherit; color: var(--text); background: var(--panel-bg); border: 3px solid var(--panel-border);
    box-shadow: 0 0 0 3px var(--panel-shadow); border-radius: 4px; align-items: center; justify-content: center; touch-action: manipulation; z-index: 3; }
  .touch-btn.active { background: var(--accent); color: #1d2142; }
  #run-btn { right: calc(24px + env(safe-area-inset-right)); bottom: calc(56px + env(safe-area-inset-bottom));
    width: 92px; height: 92px; border-radius: 50%; font-size: 9px; }
  #map-btn, #center-btn { right: calc(132px + env(safe-area-inset-right)); font-size: 8px; width: 74px; height: 38px; }
  #map-btn { bottom: calc(108px + env(safe-area-inset-bottom)); }
  #center-btn { bottom: calc(56px + env(safe-area-inset-bottom)); }
  #chat-btn { right: calc(132px + env(safe-area-inset-right)); bottom: calc(160px + env(safe-area-inset-bottom)); font-size: 8px; width: 74px; height: 38px; }
  #chat { left: 50%; bottom: 40px; transform: translateX(-50%); width: min(420px, calc(100vw - 32px)); display: flex; align-items: center; gap: 8px; padding: 8px 10px; z-index: 4; }
  #chat.hidden { display: none; }
  #chat label { font-size: 8px; color: var(--accent); white-space: nowrap; }
  #chat-input { flex: 1; min-width: 0; font: inherit; font-size: 10px; padding: 8px; color: var(--text); background: #11142c;
    border: 2px solid var(--panel-border); border-radius: 3px; }
  #chat-input:focus { outline: none; border-color: var(--accent); }
  #chat-count { font-size: 8px; color: var(--muted); min-width: 36px; text-align: right; }
  body.touch #chat { bottom: auto; top: 35%; }
  body.touch #minimap-wrap { bottom: auto; top: 128px; transform: scale(.75); transform-origin: top right; }
  @media (max-width: 700px) {
    #help { display: none; }
    #location { right: 16px; max-width: none; padding: 8px 10px; font-size: 8px; }
    #zoom { top: 92px; }
    #avatar-btn { top: 154px; }
    body.touch #minimap-wrap { top: 204px; }
    #location .street { font-size: 10px; }
    #location .meta { display: none; }
    #minimap-wrap { transform: scale(.7); transform-origin: bottom right; }
    body.touch #minimap-wrap { transform: scale(.6); transform-origin: top right; }
    #zoom button { width: 30px; height: 30px; }
    #avatar-btn { font-size: 8px; padding: 8px 10px; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="location" class="panel">
  <div id="location-text"><div class="street">…</div><div class="place"></div><div class="meta"></div></div>
  <div id="online" class="offline"><i></i><span>Connectant…</span></div>
</div>
<div id="minimap-wrap" class="panel"><div class="title">SANT ANDREU DE PALOMAR</div><canvas id="minimap"></canvas></div>
<div id="help" class="panel">
  <b>FLETXES / WASD</b> caminar · <b>SHIFT</b> córrer<br>
  <b>+ / −</b> o roda: zoom · arrossega: moure càmera<br>
  <b>C</b> centrar · <b>M</b> minimapa · <b>L</b> rètols<br>
  <b>ENTER</b> parlar · <b>N</b> fantasma · <b>P</b> avatar · <b>H</b> ajuda
</div>
<div id="zoom" class="panel">
  <button id="zoom-out" type="button" aria-label="Allunyar">−</button>
  <div id="zoom-level"><small>ZOOM</small><span>×3</span></div>
  <button id="zoom-in" type="button" aria-label="Apropar">+</button>
</div>
<button id="avatar-btn" class="panel" type="button">AVATAR<span class="key-hint"> (P)</span></button>
<div id="avatar-panel" class="hidden" role="dialog" aria-modal="true" aria-labelledby="avatar-title">
  <div class="panel">
    <h2 id="avatar-title">PERSONATGE</h2>
    <div id="avatar-side">
      <canvas id="avatar-preview" width="180" height="190"></canvas>
      <label>Nom<input id="avatar-name" maxlength="16" autocomplete="off" spellcheck="false"></label>
      <div class="avatar-actions">
        <button id="avatar-random" type="button">Aleatori</button>
        <button id="avatar-reset" type="button">Restablir</button>
        <button id="avatar-done" type="button">Fet</button>
      </div>
    </div>
    <div id="avatar-fields"></div>
  </div>
</div>
<div id="joystick" class="touch-only" aria-label="Joystick per moure el personatge"><div class="knob"></div></div>
<button id="run-btn" class="touch-btn touch-only" type="button" aria-pressed="false">Córrer</button>
<button id="map-btn" class="touch-btn touch-only" type="button">MAPA</button>
<button id="center-btn" class="touch-btn touch-only" type="button">CENTRAR</button>
<button id="chat-btn" class="touch-btn touch-only" type="button">XAT</button>
<form id="chat" class="panel hidden" autocomplete="off">
  <label for="chat-input">DIR:</label>
  <input id="chat-input" maxlength="30" enterkeyhint="send" spellcheck="false" placeholder="Escriu un missatge…">
  <span id="chat-count">0/30</span>
</form>
<div id="toast" class="panel hidden"></div>
<div id="attribution">Dades © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL)</div>
<div id="loading">Carregant Sant Andreu…</div>
<script src="game.js"></script>
</body>
</html>
