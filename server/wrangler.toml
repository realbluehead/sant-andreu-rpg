name = "sant-andreu-rpg"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# Els Durable Objects amb SQLite són els que inclou el pla gratuït
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# config.json publicat a GitHub Pages (per a desenvolupament local, sobreescriu-ho a .dev.vars)
[vars]
CONFIG_URL = "https://realbluehead.github.io/sant-andreu-rpg/config.json"
# Inici de sessió amb Google: el mateix Client ID que public/config.json (auth.googleClientId)
GOOGLE_CLIENT_ID = ""
# On arriba l'avís de nous registres. La clau de Resend és un secret:
#   npx wrangler secret put RESEND_API_KEY
NOTIFY_EMAIL = "realbluehead@gmail.com"
